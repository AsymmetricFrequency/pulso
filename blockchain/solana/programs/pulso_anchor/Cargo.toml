[package]
name = "pulso-anchor"
version = "0.1.0"
description = "Registro append-only de compromisos criptográficos de auditoría PULSO"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pulso_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
