# Lo mismo que `pnpm lint && pnpm typecheck && pnpm test` en local.
#
# Existe porque entró gente al proyecto: con una persona, romper `main` se nota y se arregla en
# cinco minutos; con siete, `main` roto bloquea a seis. Es la condición para poder hacer merge
# rápido sin revisar todo a mano.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: nadie necesita el resultado de un
# commit que ya fue reemplazado, y la cola libre importa cuando hay que desplegar con prisa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La rama tiene que llamarse como su ticket. No es orden por el orden: con siete personas
  # trabajando a la vez, una rama llamada `fix` o `pruebas` no dice a quién bloquea si se rompe, ni
  # qué se estaba resolviendo, ni si dos personas están haciendo lo mismo sin saberlo.
  #
  # La convención ya existe en el tablero: `<prioridad>/<código>-<qué hace>`, por ejemplo
  # `p0/p0-9-licencia-mapadelterremoto`. Esto solo la hace verificable.
  #
  # Se comprueba aquí y no con una regla de GitHub porque `branch_name_pattern` no está disponible
  # en repositorios de cuenta personal. La ventaja de hacerlo en CI es que el mensaje puede explicar
  # qué hacer, que es lo que a una persona nueva le hace falta.
  rama:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: La rama se llama como su ticket
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          if printf '%s' "$RAMA" | grep -Eq '^(p0|p1|p2|p3|plataforma)/(p0|p1|p2|p3|pl)-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Rama: $RAMA"
            exit 0
          fi
          echo "::error::La rama '$RAMA' no dice de qué ticket es."
          echo ""
          echo "El nombre va así:  <prioridad>/<código-del-ticket>-<qué-hace>"
          echo "Por ejemplo:       p0/p0-9-licencia-mapadelterremoto"
          echo "                   plataforma/pl-2-mover-puntos-operaciones"
          echo ""
          echo "El código sale del hilo del ticket en #tareas. Si estás trabajando en algo que no"
          echo "tiene ticket, ábrelo primero — no para el papeleo, sino porque es lo que evita que"
          echo "dos personas construyan lo mismo sin enterarse."
          echo ""
          echo "Para renombrar lo que ya empezaste:"
          echo "  git branch -m p0/p0-9-licencia-mapadelterremoto"
          echo "  git push origin -u p0/p0-9-licencia-mapadelterremoto"
          exit 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint y formato
        run: pnpm lint

      # Los paquetes compartidos se compilan antes de chequear tipos.
      #
      # `@pulso/domain` y `apps/api` importan `@pulso/schemas` por su `dist`, no por el fuente. En
      # una máquina donde ya se trabajó, ese `dist` existe de antes y el typecheck pasa; en un clon
      # limpio como este no existe y falla con trece «Cannot find module» que no tienen nada que ver
      # con el cambio. Es la misma trampa que está avisada en CONTRIBUTING.md, y la CI es justo
      # donde más despista porque nadie ve el árbol de archivos.
      - name: Compilar paquetes compartidos
        run: pnpm --filter @pulso/schemas --filter @pulso/domain build

      # `@pulso/solana` queda fuera: sus tipos los genera `anchor build` en `target/types/`, que no
      # está versionado. Instalar Rust, Solana CLI y Anchor costaría varios minutos en cada PR para
      # comprobar un programa que casi nunca cambia; se verifica con `pnpm test:solana:integration`
      # cuando se toca. Que el trabajo del día a día espere por eso sería la forma más segura de que
      # la gente empiece a ignorar la CI.
      - name: Tipos
        run: pnpm -r --filter '!@pulso/solana' typecheck

      - name: Pruebas
        run: pnpm test

      # Las pruebas de navegador van en su propio trabajo (ver abajo), no aquí: instalar Chromium
      # cuesta cerca de un minuto y bloquearía el resultado de lint y tipos, que es el que la gente
      # mira primero. Separados, un fallo de formato se ve en 90 segundos como hasta ahora.

  navegador:
    # Cierra `PL-11`. Cubre lo que ninguna prueba cubría: abrir el mapa, tocar un punto, reportar un
    # rescate y una necesidad, y comprobar que lo que sale del navegador lo acepta el mismo esquema
    # con el que el servidor lo recibe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@pulso/schemas` por su `dist`: la prueba valida el cuerpo del POST contra el esquema real.
      - name: Compilar esquemas
        run: pnpm --filter @pulso/schemas build

      # Solo Chromium. Los tres navegadores triplicarían el tiempo para cubrir un formulario que no
      # usa nada específico de motor.
      - name: Instalar Chromium
        run: pnpm --filter @pulso/web exec playwright install --with-deps chromium

      - name: Flujo de reporte
        run: pnpm --filter @pulso/web test:e2e

      # El rastro solo se guarda cuando algo falla, y es lo que permite ver qué pasó en el navegador
      # sin tener que reproducirlo a ciegas.
      - name: Guardar el rastro si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7
